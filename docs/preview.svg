<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-label="dsh-no-enter-send 行为示意：鼠标不在发送按钮上时 Enter 只换行、胶囊写着「已屏蔽Enter发送」；鼠标停在发送按钮上时 Enter 直接发送、胶囊变成实心高亮的「点击Enter发送」">
  <rect x="0.75" y="0.75" width="898.5" height="498.5" rx="16" fill="#ffffff" stroke="#e6e8eb" stroke-width="1.5"/>
  <g font-family="Segoe UI, Microsoft YaHei, PingFang SC, system-ui, sans-serif">

    <!-- ===== 标题 ===== -->
    <text x="40" y="42" font-size="14" font-weight="600" fill="#111827">鼠标在哪儿，Enter 就听谁</text>
    <text x="40" y="62" font-size="12.5" fill="#6b7280">平时 Enter 换行；鼠标停在发送按钮上时，Enter 直接发送</text>

    <!-- ===== 状态 1：未悬停 ===== -->
    <text x="40" y="90" font-size="13" font-weight="600" fill="#111827">① 鼠标不在发送按钮上</text>
    <text x="210" y="90" font-size="12.5" fill="#6b7280">Enter 被拦下，重放成 Shift+Enter</text>

    <rect x="40" y="100" width="560" height="112" rx="14" fill="#ffffff" stroke="#e6e8eb" stroke-width="1.5"/>
    <text x="64" y="136" font-size="15" fill="#111827">帮我重构这个函数，先解释一下思路</text>

    <circle cx="70" cy="182" r="12" fill="none" stroke="#c9ced6" stroke-width="1.6"/>
    <path d="M70 176.5v11M64.5 182h11" stroke="#c9ced6" stroke-width="1.6" stroke-linecap="round"/>

    <rect x="430" y="170" width="106" height="24" rx="12" fill="#f3f4f6" stroke="#e0e2e7" stroke-width="1"/>
    <text x="483" y="186" font-size="11" text-anchor="middle" fill="#6b7280">已屏蔽Enter发送</text>

    <circle cx="568" cy="182" r="15" fill="#3964fe"/>
    <path d="M568 189v-13M562.5 181.5L568 175.5l5.5 6" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

    <path d="M430 206l0 15 4-4 3 6.5 3-1.5-3-6.5 5.5-.5z" fill="#111827" stroke="#ffffff" stroke-width="1.2" stroke-linejoin="round"/>
    <text x="449" y="223" font-size="11.5" fill="#6b7280">鼠标不在这儿 → 发不出去</text>

    <text x="40" y="240" font-size="12.5" fill="#6b7280">Enter 插入换行，草稿留在输入框里，零发送请求。</text>

    <!-- ===== 状态 2：悬停 ===== -->
    <text x="40" y="278" font-size="13" font-weight="600" fill="#111827">② 鼠标停在发送按钮上</text>
    <text x="230" y="278" font-size="12.5" fill="#3964fe">Enter 恢复为发送，胶囊变实心「点击Enter发送」</text>

    <rect x="40" y="288" width="560" height="112" rx="14" fill="#ffffff" stroke="#b9cdfb" stroke-width="1.5"/>
    <text x="64" y="324" font-size="15" fill="#111827">帮我重构这个函数，先解释一下思路</text>

    <circle cx="70" cy="370" r="12" fill="none" stroke="#c9ced6" stroke-width="1.6"/>
    <path d="M70 364.5v11M64.5 370h11" stroke="#c9ced6" stroke-width="1.6" stroke-linecap="round"/>

    <rect x="430" y="358" width="106" height="24" rx="12" fill="#3964fe"/>
    <text x="483" y="374" font-size="11" text-anchor="middle" fill="#ffffff" font-weight="500">点击Enter发送</text>

    <circle cx="568" cy="370" r="20" fill="none" stroke="#3964fe" stroke-width="2" opacity="0.28"/>
    <circle cx="568" cy="370" r="15" fill="#3964fe"/>
    <path d="M568 377v-13M562.5 369.5L568 363.5l5.5 6" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

    <path d="M575 382l0 15 4-4 3 6.5 3-1.5-3-6.5 5.5-.5z" fill="#111827" stroke="#ffffff" stroke-width="1.2" stroke-linejoin="round"/>

    <text x="40" y="428" font-size="12.5" fill="#6b7280">Enter 原样放行给 DSH 自己的 keymap —— 和点发送按钮完全一样，还能享受连敲 Enter 的爽感。</text>

    <!-- ===== 右侧说明 ===== -->
    <g font-size="12" fill="#6b7280">
      <text x="632" y="112">判定发生在按 Enter 那一刻：</text>
      <text x="632" y="132">实时读按钮真实的 :hover 状态，</text>
      <text x="632" y="152">不装监听、不留状态。</text>
      <text x="632" y="182">不在按钮上 → 拦截并重放换行；</text>
      <text x="632" y="202">在按钮上 → 原封不动放行，</text>
      <text x="632" y="222">发送、防连发、忙碌拦截</text>
      <text x="632" y="242">全部交给官方逻辑。</text>
    </g>

    <g font-size="12" fill="#6b7280">
      <text x="632" y="284">不会忘记切模式：</text>
      <text x="632" y="304">抬手移开，保护立刻恢复。</text>
      <text x="632" y="334">按钮禁用（空草稿 / 忙碌）</text>
      <text x="632" y="354">时，悬停也不解锁。</text>
      <text x="632" y="386">胶囊平时写「已屏蔽Enter发送」，</text>
      <text x="632" y="406">空输入框另有「· Enter 换行」——</text>
      <text x="632" y="426">说的都是此刻真会发生的事。</text>
    </g>

    <!-- ===== 键盘对照 ===== -->
    <line x1="40" y1="446" x2="860" y2="446" stroke="#eef0f3" stroke-width="1.5"/>

    <rect x="40" y="462" width="76" height="30" rx="9" fill="#ffffff" stroke="#c9ced6" stroke-width="1.5"/>
    <text x="78" y="482" font-size="12.5" text-anchor="middle" fill="#6b7280">Enter</text>
    <text x="126" y="482" font-size="12" fill="#111827">未悬停：换行</text>

    <rect x="210" y="462" width="76" height="30" rx="9" fill="#ffffff" stroke="#c9ced6" stroke-width="1.5"/>
    <text x="248" y="482" font-size="12.5" text-anchor="middle" fill="#6b7280">Enter</text>
    <text x="296" y="482" font-size="12" fill="#3964fe">悬停：发送</text>

    <rect x="386" y="462" width="130" height="30" rx="9" fill="#ffffff" stroke="#c9ced6" stroke-width="1.5"/>
    <text x="451" y="482" font-size="12.5" text-anchor="middle" fill="#6b7280">Shift + Enter</text>
    <text x="528" y="482" font-size="12" fill="#111827">永远换行</text>

    <rect x="610" y="462" width="110" height="30" rx="9" fill="#ffffff" stroke="#c9ced6" stroke-width="1.5"/>
    <text x="665" y="482" font-size="12" text-anchor="middle" fill="#6b7280">Ctrl / ⌘ / Alt</text>
    <text x="732" y="482" font-size="12" fill="#111827">不发送也不换行</text>
  </g>
</svg>
